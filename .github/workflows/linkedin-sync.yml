name: LinkedIn Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/**'
      - 'README.md'
      - 'certifications/**'
      - 'linkedin-sync/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: detect
        run: |
          echo "Detecting changes..."
          # Detectar qué archivos cambiaron
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Sync projects to LinkedIn
        run: |
          echo "Syncing projects to LinkedIn..."
          # Aquí se llamaría al script de sincronización
          # Por ahora, solo se detectan los cambios

      - name: Update sync log
        run: |
          echo "Updating sync log..."
          # Actualizar sync-log.md con los cambios detectados

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add linkedin-sync/
          git diff --staged --quiet || git commit -m "Update LinkedIn sync log"
          git push
